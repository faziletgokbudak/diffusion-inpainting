[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-inpainting"
version = "0.1.0"
description = "Class-conditional DDPM and score-distillation inpainting on MNIST"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "torchvision>=0.15", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
